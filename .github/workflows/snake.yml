name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake (SVG + GIF)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58A6FF
            dist/github-contribution-grid-snake.gif?palette=github-dark&color_snake=#58A6FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353&color_background=#0D1117
            dist/github-contribution-grid-snake-blue.gif?color_snake=#58A6FF&color_dots=#0D1117,#1F3A5F,#2F6FED,#58A6FF,#79C0FF&color_background=#0D1117

      - name: Push snake diagrams to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
